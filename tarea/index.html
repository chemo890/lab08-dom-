<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi día — versión 2</title>
  <style>body{font:18px system-ui;background:#f5f3ec;color:#243b2a;max-width:640px;margin:60px auto;padding:24px}li{padding:16px;background:white;margin-bottom:12px;border-radius:12px}</style>
</head>
<body>
  <main>
    <p>LAB 08 · VERSIÓN 2</p>
    <h1>Mi día</h1>
    <p>Segundo paso: agregar, marcar y borrar con eventos.</p>
    <form id="formulario" novalidate>
      <label for="titulo">Nueva tarea</label>
      <input id="titulo" name="titulo" maxlength="80" aria-describedby="mensaje">
      <button type="submit">Agregar tarea</button>
      <p id="mensaje" role="status" aria-live="polite"></p>
    </form>
    <label for="buscador">Buscar tareas</label>
    <input id="buscador" type="search">
    <ul id="lista-tareas"></ul>
    <p id="resumen"></p>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
